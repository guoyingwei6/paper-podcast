<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Podcast - 科研播客</title>
  <link rel="icon" type="image/jpeg" href="cover.jpg">
  <link rel="apple-touch-icon" href="cover.jpg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0f172a;
      --text: #e2e8f0;
      --header-grad-a: #1e293b;
      --header-grad-b: #0f172a;
      --border: #1e293b;
      --heading: #f1f5f9;
      --muted: #94a3b8;
      --dim: #64748b;
      --card: #1e293b;
      --card-border: #334155;
      --card-border-hover: #475569;
      --accent: #60a5fa;
      --accent-hover: #93bbfd;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --text: #1e293b;
        --header-grad-a: #e2e8f0;
        --header-grad-b: #f8fafc;
        --border: #e2e8f0;
        --heading: #0f172a;
        --muted: #475569;
        --dim: #64748b;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --card-border-hover: #cbd5e1;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: linear-gradient(135deg, var(--header-grad-a) 0%, var(--header-grad-b) 100%);
      border-bottom: 1px solid var(--border);
    }

    .header img {
      width: 120px;
      height: 120px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      margin-bottom: 1rem;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--heading);
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 1rem;
    }

    .subscribe {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .subscribe:hover { border-color: var(--accent); color: var(--text); }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
    }

    .episode {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      transition: border-color 0.2s;
    }

    .episode:hover { border-color: var(--card-border-hover); }

    .episode-date {
      font-size: 0.75rem;
      color: var(--dim);
      margin-bottom: 0.5rem;
    }

    .episode-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--heading);
      margin-bottom: 0.5rem;
    }

    .episode-duration {
      font-size: 0.75rem;
      color: var(--dim);
      margin-bottom: 0.75rem;
    }

    .episode audio {
      width: 100%;
      height: 40px;
      margin-bottom: 0.75rem;
    }

    .episode-desc {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-line;
      display: none;
    }

    .episode-desc.open { display: block; }

    .toggle-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0;
    }

    .toggle-btn:hover { color: var(--accent-hover); }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--dim);
    }

    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--dim);
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="cover.jpg" alt="Paper Podcast">
    <h1>Paper Podcast - 科研播客</h1>
    <p>AI 生成的科研论文解读播客，由两位动物基因组学博士主持</p>
    <div style="display:inline-flex;gap:0.5rem;">
      <a class="subscribe" href="https://github.com/guoyingwei6/paper-podcast" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
        GitHub
      </a>
      <a class="subscribe" href="https://guoyingwei6.github.io/paper-podcast/feed.xml" target="_blank">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="6.18" cy="17.82" r="2.18"/><path d="M4 4.44v2.83c7.03 0 12.73 5.7 12.73 12.73h2.83c0-8.59-6.97-15.56-15.56-15.56zm0 5.66v2.83c3.9 0 7.07 3.17 7.07 7.07h2.83c0-5.47-4.43-9.9-9.9-9.9z"/></svg>
        RSS 订阅
      </a>
    </div>
  </div>

  <div class="container">
    <div id="episodes" class="loading">加载中...</div>
  </div>

  <script>
    async function loadFeed() {
      const container = document.getElementById('episodes');
      try {
        const resp = await fetch('feed.xml');
        const text = await resp.text();
        const xml = new DOMParser().parseFromString(text, 'text/xml');
        const items = xml.querySelectorAll('item');

        if (items.length === 0) {
          container.innerHTML = '<div class="empty">暂无播客内容</div>';
          return;
        }

        container.innerHTML = '';
        container.classList.remove('loading');

        // 按日期倒序，最新的在最上面
        const sorted = [...items].sort((a, b) => {
          const da = new Date(a.querySelector('pubDate')?.textContent || 0);
          const db = new Date(b.querySelector('pubDate')?.textContent || 0);
          return db - da;
        });

        sorted.forEach((item) => {
          const title = item.querySelector('title')?.textContent || '';
          const desc = item.querySelector('description')?.textContent || '';
          const audioUrl = item.querySelector('enclosure')?.getAttribute('url') || '';
          const pubDate = item.querySelector('pubDate')?.textContent || '';
          // feed 中已有 itunes:duration，优先使用，避免额外加载音频元数据
          const durationTag = item.getElementsByTagName('itunes:duration')[0];
          const feedDuration = durationTag?.textContent?.trim() || '';

          const date = pubDate ? new Date(pubDate).toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric' }) : '';

          const el = document.createElement('div');
          el.className = 'episode';

          const dateEl = document.createElement('div');
          dateEl.className = 'episode-date';
          dateEl.textContent = date;

          const titleEl = document.createElement('div');
          titleEl.className = 'episode-title';
          titleEl.textContent = title;

          const durEl = document.createElement('div');
          durEl.className = 'episode-duration';
          durEl.textContent = feedDuration && feedDuration !== '0:00' ? '时长 ' + feedDuration : '时长加载中...';

          const audio = document.createElement('audio');
          audio.controls = true;
          audio.preload = 'metadata';
          audio.src = audioUrl;

          const btn = document.createElement('button');
          btn.className = 'toggle-btn';
          btn.textContent = '展开详情';
          btn.addEventListener('click', () => toggleDesc(btn));

          const descEl = document.createElement('div');
          descEl.className = 'episode-desc';
          descEl.textContent = desc;

          el.append(dateEl, titleEl, durEl, audio, btn, descEl);
          container.appendChild(el);

          // feed 无时长时，回退到音频元数据
          if (!feedDuration || feedDuration === '0:00') {
            audio.addEventListener('loadedmetadata', () => {
              const secs = Math.floor(audio.duration);
              const m = Math.floor(secs / 60);
              const s = secs % 60;
              durEl.textContent = '时长 ' + m + ':' + String(s).padStart(2, '0');
            });
          }
        });
      } catch (e) {
        container.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
      }
    }

    function toggleDesc(btn) {
      const desc = btn.nextElementSibling;
      const open = desc.classList.toggle('open');
      btn.textContent = open ? '收起详情' : '展开详情';
    }

    loadFeed();
  </script>
</body>
</html>
